name: Deploy to siparoki.ppbgmadrossoe.com

on:
  push:
    branches: [ main, paroki ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to cPanel Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, mysql, zip, gd, pdo, pdo_mysql
          tools: composer:v2

      - name: Composer Install (Production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --ignore-platform-reqs

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: NPM Install & Build Assets
        run: |
          npm ci
          npm run build

      - name: Deploy via FTP to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            .env.*
            storage/app/public/**
            storage/logs/**
            storage/framework/cache/**
            storage/framework/sessions/**
            storage/framework/views/**
            public/storage/**
            .phpunit.result.cache
            scratch/
            tests/

      - name: Success Notification
        run: echo "Deployment to siparoki.ppbgmadrossoe.com successfully finished for commit ${{ github.sha }}!"
