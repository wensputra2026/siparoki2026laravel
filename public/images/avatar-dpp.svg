<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="dppBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f766e"/>
            <stop offset="100%" stop-color="#042f2e"/>
        </linearGradient>
        
        <!-- Skin Gradient -->
        <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fed7aa"/>
            <stop offset="100%" stop-color="#fdba74"/>
        </linearGradient>
        
        <!-- Hair Gradient (Dark Brown/Black Natural Hair) -->
        <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#334155"/>
            <stop offset="50%" stop-color="#1e293b"/>
            <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>

        <!-- Suit Gradient -->
        <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#334155"/>
            <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>

        <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.18"/>
        </filter>
    </defs>
    
    <!-- Background Circle -->
    <circle cx="100" cy="100" r="100" fill="url(#dppBgGrad)"/>
    <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
    
    <!-- Shoulders & Formal Suit -->
    <path d="M 30 200 C 30 150, 60 136, 100 136 C 140 136, 170 150, 170 200 Z" fill="url(#suitGrad)" filter="url(#dropShadow)"/>
    
    <!-- White Shirt & Orange Tie -->
    <path d="M 82 136 L 100 170 L 118 136 Z" fill="#ffffff"/>
    <path d="M 96 148 L 100 195 L 104 148 Z" fill="#ea580c"/>
    <polygon points="95,145 105,145 103,152 97,152" fill="#c2410c"/>

    <!-- Neck -->
    <path d="M 87 114 L 113 114 L 113 140 L 87 140 Z" fill="url(#skinGrad)"/>
    <!-- Neck Shadow -->
    <path d="M 87 114 C 95 125, 105 125, 113 114 L 113 124 C 105 130, 95 130, 87 124 Z" fill="#fb923c" opacity="0.4"/>

    <!-- Ears -->
    <circle cx="62" cy="94" r="8" fill="#fdba74"/>
    <circle cx="138" cy="94" r="8" fill="#fdba74"/>
    <circle cx="62" cy="94" r="5" fill="#fb923c" opacity="0.3"/>
    <circle cx="138" cy="94" r="5" fill="#fb923c" opacity="0.3"/>

    <!-- Head / Face -->
    <ellipse cx="100" cy="90" rx="36" ry="42" fill="url(#skinGrad)" filter="url(#dropShadow)"/>

    <!-- Eyes (Friendly Expression) -->
    <circle cx="87" cy="88" r="3.2" fill="#1e293b"/>
    <circle cx="113" cy="88" r="3.2" fill="#1e293b"/>
    <circle cx="88" cy="87" r="1" fill="#ffffff"/>
    <circle cx="114" cy="87" r="1" fill="#ffffff"/>

    <!-- Eyebrows -->
    <path d="M 80 81 Q 87 77 94 80" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M 106 80 Q 113 77 120 81" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" fill="none"/>

    <!-- Friendly Smile & Nose -->
    <path d="M 100 87 L 100 95 L 97 97" stroke="#ea580c" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M 91 106 Q 100 114 109 106" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Natural Modern Hair (Rambut Manusia Biasa dengan Belahan & Tekstur Alami, TANPA Topi) -->
    <!-- Hair Base -->
    <path d="M 62 82 C 60 52, 75 42, 100 42 C 125 42, 140 52, 138 82 C 132 68, 122 62, 100 62 C 78 62, 68 68, 62 82 Z" fill="url(#hairGrad)" filter="url(#dropShadow)"/>
    
    <!-- Hair Volume & Strands (Side Part Modern Cut) -->
    <path d="M 62 80 C 60 55, 76 40, 100 40 C 122 40, 138 52, 138 78 C 134 62, 120 54, 98 56 C 80 58, 68 68, 62 80 Z" fill="#475569"/>
    <!-- Forehead Hair Strands -->
    <path d="M 64 78 C 70 64, 82 58, 98 58 C 112 58, 126 64, 134 76 C 126 68, 114 64, 102 65 C 88 66, 76 72, 64 78 Z" fill="#1e293b"/>
    <!-- Sideburns -->
    <path d="M 63 80 L 64 92 L 67 92 L 67 82 Z" fill="#1e293b"/>
    <path d="M 137 80 L 136 92 L 133 92 L 133 82 Z" fill="#1e293b"/>

    <!-- Small Lapel Golden Cross Pin -->
    <g transform="translate(138, 162) scale(0.7)">
        <circle cx="12" cy="12" r="11" fill="#f59e0b" filter="url(#dropShadow)"/>
        <path d="M 12 5 L 12 19 M 7 10 L 17 10" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
    </g>
</svg>
