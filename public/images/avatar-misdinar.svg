<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
        <linearGradient id="misdinarBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#dc2626"/>
            <stop offset="50%" stop-color="#b91c1c"/>
            <stop offset="100%" stop-color="#991b1b"/>
        </linearGradient>
        <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffedd5"/>
            <stop offset="100%" stop-color="#fed7aa"/>
        </linearGradient>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
        </filter>
    </defs>
    
    <!-- Background Circle -->
    <circle cx="100" cy="100" r="100" fill="url(#misdinarBg)"/>
    
    <!-- Outer Glow -->
    <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    
    <!-- Red Cassock (Jubah Merah Misdinar) -->
    <path d="M 35 200 C 35 155, 65 140, 100 140 C 135 140, 165 155, 165 200 Z" fill="#991b1b" filter="url(#shadow)"/>
    
    <!-- White Surplice (Superpli Putih) -->
    <path d="M 50 200 C 50 155, 70 142, 100 142 C 130 142, 150 155, 150 200 Z" fill="#ffffff" filter="url(#shadow)"/>
    <path d="M 85 142 L 100 162 L 115 142 Z" fill="#991b1b"/>

    <!-- Neck -->
    <path d="M 88 120 L 112 120 L 112 145 L 88 145 Z" fill="url(#skinGrad)"/>

    <!-- Head / Face -->
    <ellipse cx="100" cy="90" rx="33" ry="38" fill="url(#skinGrad)" filter="url(#shadow)"/>

    <!-- Youthful Hair -->
    <path d="M 68 85 C 66 64, 82 50, 100 50 C 118 50, 134 64, 132 85 C 124 72, 114 68, 100 68 C 86 68, 76 72, 68 85 Z" fill="#1e293b"/>

    <!-- Ears -->
    <circle cx="68" cy="92" r="6.5" fill="#fed7aa"/>
    <circle cx="132" cy="92" r="6.5" fill="#fed7aa"/>

    <!-- Mini Altar Cross on Breast -->
    <g transform="translate(93, 166)">
        <path d="M 7 0 L 7 18 M 1 6 L 13 6" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
    </g>
</svg>
